name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          VITE_MAPTILER_API_KEY: ci-placeholder

  backend-unit:
    name: Backend (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest
        run: pytest tests/ -v

  backend-qa:
    name: Backend (integration QA)
    runs-on: ubuntu-latest
    needs: [backend-unit]
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --build backend-service db

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6000/health; then exit 0; fi
            sleep 3
          done
          echo "Backend failed to become healthy"
          docker compose logs backend-service
          exit 1

      - name: Run QA smoke tests
        run: BACKEND_URL=http://localhost:6000 python backend-service/qa_test.py

      - name: Tear down
        if: always()
        run: docker compose down -v
